<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>
    <script th:src="@{/js/htmx.min.js}"></script>
    <link th:href="@{/styles/css/bulma.min.css}" rel="stylesheet"/>
    <script>
        function selectImdb(button) {
            const imdbId = button.dataset.id;
            document.getElementById('imdbId').value = imdbId;
            document.getElementById('selected-imdb-id').value = imdbId;
            const buttons = document.querySelectorAll('#imdb-results button');
            buttons.forEach(btn => btn.classList.remove('is-primary'));
            button.classList.add('is-primary');
        }

        function selectFilmweb(button) {
            const filmwebId = button.dataset.id;
            document.getElementById('filmwebId').value = filmwebId;
            document.getElementById('selected-filmweb-id').value = filmwebId;
            const buttons = document.querySelectorAll('#filmweb-results button');
            buttons.forEach(btn => btn.classList.remove('is-primary'));
            button.classList.add('is-primary');
        }
    </script>
</head>
<body>

<header>
    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <b class="navbar-item">Admin Dashboard</b>
        </div>
        <div class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" hx-get="/admin/cities" hx-target="#content" hx-push-url="true">Cities</a>
                <a class="navbar-item" hx-get="/admin/cinemas" hx-target="#content" hx-push-url="true">Cinemas</a>
                <a class="navbar-item" hx-get="/admin/movies" hx-target="#content" hx-push-url="true">Movies</a>
                <a class="navbar-item" hx-get="/admin/showings" hx-target="#content" hx-push-url="true">Showings</a>
                <a class="navbar-item" hx-get="/admin/jobs" hx-target="#content" hx-push-url="true">Jobs</a>
            </div>
            <div class="navbar-end">
                <div class="navbar-item">
                    <form th:action="@{/logout}" method="post" class="buttons">
                        <button class="button is-primary" type="submit">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</header>

<main id="content" class="container"
      th:attr="hx-get=${!#strings.isEmpty(initialFragmentUrl) ? initialFragmentUrl : null},
               hx-trigger=${!#strings.isEmpty(initialFragmentUrl) ? 'load' : null},
               hx-swap=${!#strings.isEmpty(initialFragmentUrl) ? 'innerHTML' : null}">
    <p class="block" th:if="${#strings.isEmpty(initialFragmentUrl)}">Select an item from the menu to view details.</p>
</main>

</body>
</html>
