<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <script src="/js/htmx.min.js" th:src="@{/js/htmx.min.js}"></script>
    <style>
        body { font-family: sans-serif; margin: 0; }
        .sidebar {
            width: 200px;
            background: #f4f4f4;
            padding: 1rem;
            height: 100vh;
            position: fixed;
        }
        .main-content {
            margin-left: 220px;
            padding: 1rem;
        }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: 1rem; }
        button { padding: 0.5rem 1rem; cursor: pointer; }
        #user-list-container { margin-top: 2rem; border: 1px solid #eee; padding: 1rem; min-height: 100px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>Admin Menu</h2>
    <nav>
        <ul>
            <li><a href="/admin/cities" hx-get="/admin/cities" hx-target="#content">Cities</a></li>
            <li><a href="/admin/cinemas" hx-get="/admin/cinemas" hx-target="#content">Cinemas</a></li>
            <li><a href="/admin/movies" hx-get="/admin/movies" hx-target="#content">Movies</a></li>
            <li><a href="/admin/showings" hx-get="/admin/showings" hx-target="#content">Showings</a></li>
        </ul>
    </nav>
</div>

<div class="main-content">
    <header>
        <h1>Admin Dashboard</h1>
        <div>
            <span>Welcome, <b sec:authentication="name">Admin</b>!</span>
            <form th:action="@{/logout}" method="post" style="display: inline; margin-left: 1rem;">
                <button type="submit">Logout</button>
            </form>
        </div>
    </header>

    <main id="content">
        <p>Select an item from the menu to view details.</p>
    </main>
</div>

</body>
</html>
