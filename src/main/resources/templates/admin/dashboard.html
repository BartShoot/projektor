<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <script th:src="@{/js/htmx.min.js}"></script>
    <link th:href="@{/styles/css/missing.min.css}" rel="stylesheet" />
    <script>
        function selectImdb(button) {
            const imdbId = button.dataset.id;
            document.getElementById('imdbId').value = imdbId;
            document.getElementById('selected-imdb-id').textContent = imdbId;
            const buttons = document.querySelectorAll('#imdb-results button');
            buttons.forEach(btn => btn.style.fontWeight = 'normal');
            button.style.fontWeight = 'bold';
        }

        function selectFilmweb(button) {
            const filmwebId = button.dataset.id;
            document.getElementById('filmwebId').value = filmwebId;
            document.getElementById('selected-filmweb-id').textContent = filmwebId;
            const buttons = document.querySelectorAll('#filmweb-results button');
            buttons.forEach(btn => btn.style.fontWeight = 'normal');
            button.style.fontWeight = 'bold';
        }
    </script>
</head>
<body>

<header class="navbar">
    <nav aria-label="Admin Menu">
        <ul role="list">
            <li><a href="/admin/cities" hx-get="/admin/cities" hx-target="#content">Cities</a></li>
            <li><a href="/admin/cinemas" hx-get="/admin/cinemas" hx-target="#content">Cinemas</a></li>
            <li><a href="/admin/movies" hx-get="/admin/movies" hx-target="#content">Movies</a></li>
            <li><a href="/admin/showings" hx-get="/admin/showings" hx-target="#content">Showings</a></li>
        </ul>
    </nav>
</header>

<div>
    <header>
        <h1>Admin Dashboard</h1>
        <div>
            <span>Welcome, <b sec:authentication="name">Admin</b>!</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit">Logout</button>
            </form>
        </div>
    </header>

    <main id="content">
        <p>Select an item from the menu to view details.</p>
    </main>
</div>

</body>
</html>
