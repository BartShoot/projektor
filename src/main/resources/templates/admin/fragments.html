<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Cities Table Fragment -->
<div th:fragment="cities-table">
    <h3 class="title">Cities</h3>
    <table class="table is-stripped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="city : ${cities}">
            <td th:text="${city.id}"></td>
            <td th:text="${city.name}"></td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Cinemas Table Fragment -->
<div th:fragment="cinemas-table">
    <h3 class="title">Cinemas</h3>
    <table class="table is-stripped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cinema : ${cinemas}">
            <td th:text="${cinema.id}"></td>
            <td th:text="${cinema.name}"></td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Movies Table Fragment -->
<div th:fragment="movies-table">
    <h3 class="title">Movies</h3>
    <table class="table is-stripped is-hoverable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Showings</th>
            <th>Filmweb</th>
            <th>IMDb</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="movie : ${movies}">
            <td th:text="${movie.id}"></td>
            <td th:text="${movie.title}"></td>
            <td th:text="${movie.showingsCount}"></td>
            <td>
                <a th:if="${movie.filmwebUrl}" th:href="${movie.filmwebUrl}" th:text="${movie.title}"
                   target="_blank"></a>
                <span th:unless="${movie.filmwebUrl}">-</span>
            </td>
            <td>
                <a th:if="${movie.imdbUrl}" th:href="${movie.imdbUrl}" th:text="${movie.title}" target="_blank"></a>
                <span th:unless="${movie.imdbUrl}">-</span>
            </td>
            <td>
                <a th:attr="hx-get=@{/admin/movie/{id}/edit(id=${movie.id})}" hx-target="#content" hx-swap="innerHTML"
                   class="btn btn-secondary btn-sm">Edit</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>


<!-- Showings View Fragment -->
<div class="block" id="showings-view" th:fragment="showings-view">
    <h3 class="title">Showings</h3>

    <form hx-get="/admin/showings" hx-target="#showings-view" hx-swap="outerHTML">
        <div class="field">
            <label class="label" for="cinema-select">Select a Cinema:</label>
            <div class="control select">
                <select id="cinema-select" name="cinemaId" onchange="this.form.requestSubmit()">
                    <option value="">-- Please choose a cinema --</option>
                    <option th:each="cinema : ${cinemas}"
                            th:value="${cinema.id}"
                            th:text="${cinema.name}"
                            th:selected="${param.cinemaId != null && #strings.equals(param.cinemaId[0], cinema.id.toString())}"></option>
                </select>
            </div>
        </div>
    </form>

    <div id="showings-table-container">
        <div class="block" th:if="${not #lists.isEmpty(showings)}">
            <h4 class="block">Showings for selected cinema</h4>
            <table class="table is-stripped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Movie</th>
                    <th>Start Time</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="showing : ${showings}">
                    <td th:text="${showing.id}"></td>
                    <td th:text="${showing.movie.title}"></td>
                    <td th:text="${showing.showingTime}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${#lists.isEmpty(showings) and param.cinemaId != null}">
            <p>No showings found for the selected cinema.</p>
        </div>
    </div>
</div>


</body>
</html>
