<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link th:href="@{/styles/css/bulma.min.css}" rel="stylesheet"/>
</head>
<body>

<section class="section">
    <h1 class="title">Create a new user</h1>
</section>
<main class="container is-max-tablet">
    <div th:if="${param.error}" class="notification is-danger">
        <p th:if="${param.error[0] == 'passphrase'}">Invalid passphrase.</p>
        <p th:if="${param.error[0] == 'username'}">Username already exists.</p>
    </div>

    <form th:action="@{/user/register}" method="post" class="box">
        <div class="field">
            <label for="username" class="label">Username:</label>
            <div class="control">
                <input class="input" type="text" id="username" name="username" required autofocus>
            </div>
        </div>
        <div class="field">
            <label for="password" class="label">Password:</label>
            <div class="control">
                <input class="input" type="password" id="password" name="password" required>
            </div>
        </div>
        <div class="field">
            <label for="passphrase" class="label">Passphrase:</label>
            <div class="control">
                <input class="input" type="password" id="passphrase" name="passphrase" required>
            </div>
        </div>
        <div class="field">
            <div class="control">
                <button class="button is-link" type="submit">Register</button>
            </div>
        </div>
    </form>
</main>
</body>
</html>
